# Shared 4-CPU / 15 GB machines: keep daemons small.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx2g
org.gradle.parallel=true
org.gradle.workers.max=3
org.gradle.caching=true
org.gradle.configuration-cache=true
# AGP 9 defaults are kept (android.newDsl=true, android.builtInKotlin=true); no opt-outs.
android.useAndroidX=true
android.nonTransitiveRClass=true
# Maven Central sometimes answers HTTP 429 when several builds resolve at once: retry longer.
systemProp.org.gradle.internal.repository.max.retries=12
systemProp.org.gradle.internal.repository.initial.backoff=2000
systemProp.org.gradle.internal.http.connectionTimeout=60000
systemProp.org.gradle.internal.http.socketTimeout=60000
