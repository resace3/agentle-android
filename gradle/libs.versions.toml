# Agentle version catalog. Versions verified 2026-10-01/02 against Maven Central, the Gradle Plugin Portal and the
# official AndroidX release pages (docs/research/07-architecture-and-versions.md, docs/research/libs.versions.toml.draft).
# Policy: latest stable unless a comment justifies a pre-release (detekt 2.0.0-alpha.6 is required with AGP 9).
# Gradle wrapper 9.7.1 (gradle/wrapper/gradle-wrapper.properties). JDK 21 runs Gradle and tests; bytecode target 17.

[versions]
# ---------------------------------------------------------------- SDK levels (read by build-logic)
compileSdk = "37"                    # Android 17; AGP 9.3 and 9.4 support up to API 37 [AGP-ABOUT]
compileSdkMinor = "1"                # platforms;android-37.1 (QPR1, a base SDK). API 37 ships as 37.0/37.1 packages
                                     # (doc 01 s9: Agentle compiles against android-37.1).
targetSdk = "37"
minSdk = "29"                        # PROVISIONAL: doc 01 recommends 29, doc 02 prefers 31 (29 acceptable).
                                     # No library below needs more than 24 (s8.7). The spike used 28.

# ---------------------------------------------------------------- Build toolchain
agp = "9.3.3"                        # [AGP-93] latest 9.3 patch (fixes 10 R8/D8 issues). Newest stable is 9.4.0
                                     # (Sept 2026) [AGP-94], not yet in KGP 2.4.20's tested AGP range (8.5.2-9.3.1)
                                     # [KGP-COMPAT]. Re-check when Kotlin 2.5.0 ships (planned Dec 2026).
kotlin = "2.4.20"                    # [MC] 2026-09-07. Newest pre-release 2.5.0-Beta1 (2026-09-23), not used.
ksp = "2.3.12"                       # [MC] 2026-09-09; KSP2 is versioned independently of Kotlin since 2.3.0 [KSP-QS]

# ---------------------------------------------------------------- AndroidX / Compose (Google Maven)
composeBom = "2026.09.00"            # [BOM-MAP] compose 1.12.1, material3 1.4.0, material3-adaptive 1.3.0
activityCompose = "1.13.0"           # [AX:activity] (1.14.0-alpha03 not used)
coreKtx = "1.19.1"                   # [AX:core]
lifecycle = "2.11.0"                 # [AX:lifecycle] incl. lifecycle-viewmodel-navigation3 (2.12.0-alpha04 not used)
navigation3 = "1.2.0"                # [AX:navigation3] (1.3.0-alpha01 not used). Nav 2 (2.10.2) is not used.
androidxHilt = "1.4.0"               # [AX:hilt] hilt-work, hilt-compiler, hilt-lifecycle-viewmodel-compose
room3 = "3.0.3"                      # [ROOM3-RN] stable; 3.1.0-alpha01 not used. Room 2.8.5 is the fallback (s4).
sqlite = "2.7.1"                     # [AX:sqlite] sqlite-bundled (prod) / sqlite-framework (Robolectric tests)
datastore = "1.2.1"                  # [AX:datastore] (1.3.0-alpha11 not used)
work = "2.12.0"                      # [AX:work] minSdk 24. work-runtime-ktx is empty since 2.9.0: use work-runtime.
paging = "3.5.1"                     # [AX:paging]
media3 = "1.11.1"                    # [AX:media3] transformer/effect for video composition (docs 03/04 decide use)
browser = "1.10.0"                   # [AX:browser] Custom Tabs for the ChatGPT sign-in flow (doc 06)
uiautomator = "2.4.0"                # [AX:test-uiautomator] stable 2026-07-01
healthConnect = "1.1.0"              # [AX:health-connect] stable; 1.2.0-alpha06 only if doc 05 needs its APIs
healthConnectTesting = "1.0.0-alpha04" # [AX:health-connect] PRE-RELEASE, test-only (FakeHealthConnectClient);
                                     # no stable exists. Use only if :connectors:healthconnect is built.
credentials = "1.6.0"                # [AX:credentials] OPTIONAL: only for Sign in with Google (not needed for
                                     # AuthorizationClient). 1.7.0-alpha03 not used.
androidxTestCore = "1.7.0"           # [AX:test] core-ktx
androidxTestRunner = "1.7.0"         # [AX:test]
androidxTestRules = "1.7.0"          # [AX:test]
androidxTestExtJunit = "1.3.0"       # [AX:test] junit-ktx
androidxTestExtTruth = "1.7.0"       # [AX:test]
espresso = "3.7.0"                   # [AX:test]

# ---------------------------------------------------------------- Google Play services / Google Maven-only
playServicesAuth = "22.0.0"          # [AUTHZ] official authorization guide snippet; doc 05 cites GMS release notes
                                     # (2026-08-26). Latest-ness UNVERIFIED (Google Maven metadata unreachable).
playServicesLocation = "21.4.0"      # UNVERIFIED as latest: seen in Google's platform-samples catalog [PS]
desugarJdkLibs = "2.1.5"             # [DESUGAR-CL] OPTIONAL: only if coreLibraryDesugaring is enabled (not needed
                                     # for java.time with minSdk >= 26)
# googleid (com.google.android.libraries.identity.googleid): UNVERIFIED, the official page says "<latest version>";
# only needed for Sign in with Google, so it is left out.

# ---------------------------------------------------------------- DI
hilt = "2.60.1"                      # [MC] 2026-07-06 (Dagger + Hilt + Hilt Gradle plugin). Add
                                     # ksp(kotlin-metadata-jvm) next to the compiler (s5.3 W3, verified s5.2).

# ---------------------------------------------------------------- Kotlin libraries
kotlinxCoroutines = "1.11.0"         # [MC] 2026-05-07
kotlinxSerialization = "1.11.0"      # [MC] 2026-04-09; 1.12.0-RC (2026-09-04) not used
kotlinxDatetime = "0.8.0"            # [MC][KDT-CL] Instant/Clock come from kotlin.time; never the -0.6.x-compat artifact
kotlinxCollectionsImmutable = "0.5.2" # [MC] 2026-08-28
nimbusJoseJwt = "10.10"               # [MC] ID-token verification for Sign in with ChatGPT (doc 06)

# ---------------------------------------------------------------- Networking
okhttp = "5.5.0"                     # [MC] 2026-08-16 (okhttp, logging-interceptor, mockwebserver3*)
retrofit = "3.0.0"                   # [MC] 2025-05-15; its POM asks for OkHttp 4.12.0, resolution takes 5.5.0
                                     # (verified in the JVM check)

# ---------------------------------------------------------------- Security, images, leak detection
tink = "1.23.0"                      # [MC] 2026-07-09 tink-android (Keystore-wrapped AEAD). security-crypto is
                                     # deprecated [AX:security]: do not add it.
sqlcipher = "4.19.1"                 # [MC][SQLCIPHER] Adopted (R04 §3.2): DB encrypted in every app variant; SQLCipherDriver
                                     # for Room 3
coil = "3.6.3"                       # [MC][COIL-CL] 3.6.3 fixes R8 with AGP 9.4.0. coil-network-okhttp's POM asks for
                                     # OkHttp 4.12.0; with 5.5.0 at runtime: UNVERIFIED here.
leakcanary = "2.14"                  # [MC] debugImplementation only; 3.0-alpha-9 (minSdk 26) not used

# ---------------------------------------------------------------- Testing
junit4 = "4.13.2"                    # [MC] Robolectric / AndroidX Test / Compose UI tests run on JUnit 4
junitBom = "6.1.3"                   # [MC] 2026-08-07 JUnit 6 (Jupiter + Platform) for pure-JVM modules
robolectric = "4.17"                 # [MC] 2026-09-10; SDK 23-37, SDK 36/37 need Java 21 [ROBO-JAR]
roborazzi = "1.76.0"                 # [MC] 2026-09-29
truth = "1.4.5"                      # [MC] the one assertion library (AssertK 0.28.1 has had no release since 2024-04)
turbine = "1.2.1"                    # [MC]
mockk = "1.14.11"                    # [MC] 2026-05-29; boundaries only, prefer fakes

# ---------------------------------------------------------------- Static analysis, formatting, coverage, SBOM
detekt = "2.0.0-alpha.6"             # [MC][GPP] PRE-RELEASE, justified: detekt 1.23.8's Gradle plugin uses the legacy
                                     # AGP API (BaseExtension/BaseVariant) that AGP 9 hides (s7.1). Plugin id dev.detekt.
ktlint = "1.8.0"                     # [MC][KTLINT-CL] used through Spotless: kotlin { ktlint(libs.versions.ktlint.get()) }
spotless = "8.10.3"                  # [MC] 2026-09-25
kover = "0.9.11"                     # [MC][KOVER-CL] 2026-09-29
cyclonedx = "3.4.1"                  # [GPP] 2026-08-11 SBOM per release

