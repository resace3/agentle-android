[plugins]
# Declared once in the root build.gradle.kts with `apply false` (puts every plugin on one classpath, as [NIA]).
# kotlin-jvm `apply false` at the root also pins KGP 2.4.20 for AGP's built-in Kotlin (s3 item 2).
# There is deliberately NO org.jetbrains.kotlin.android alias: AGP 9 built-in Kotlin forbids applying it.
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
androidx-room3 = { id = "androidx.room3", version.ref = "room3" }                 # room3 { schemaDirectory(...) }
roborazzi = { id = "io.github.takahirom.roborazzi", version.ref = "roborazzi" }
detekt = { id = "dev.detekt", version.ref = "detekt" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
cyclonedx = { id = "org.cyclonedx.bom", version.ref = "cyclonedx" }

