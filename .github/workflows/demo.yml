name: Demo on emulator

# Builds the prodDebug APK, installs it on an emulator, launches it and pushes screenshots and the app's log to the
# demo-screenshots branch, so they can be viewed without downloading artifacts.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6.4.0
        with:
          add-job-summary: never
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build APK
        run: ./gradlew assembleProdDebug
      - name: Install, launch and screenshot
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash tools/demo_screens.sh
      - name: Publish screenshots
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan demo-screenshots
          git rm -rfq --cached . && git clean -fdq -e demo
          git add demo && git commit -qm "Demo screenshots for ${GITHUB_SHA::7}" && git push -f origin demo-screenshots
