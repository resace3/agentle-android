# CI for Agentle. The JVM job runs the pure-Kotlin modules (no Google Maven needed). The Android job builds every
# variant that ships or is tested, runs Robolectric unit tests and lint, and checks that no fake reaches a prod
# classpath. The emulator job runs instrumented tests on a matrix of API levels; it only runs when dispatched by hand
# so routine pushes don't spend emulator minutes. Every test job prints exact counts (tools/junit_summary.py).
# The JVM and Android jobs also print each module's Kover line and branch coverage next to its gate
# (build-logic CoverageGates.kt); `-Pagentle.coverage.enforce=true` would make a missed gate fail them.
# Android implementation teams push to `android/<team>` branches to get the Android build they cannot run locally
# (Google Maven is unreachable from the development container); `tools/ci_wait.py` waits for the result.
# Pushes to `android/**` run the Android job in branch-light mode (Robolectric SDKs 29 and 37 only, lintDebug only);
# pushes to main, pull requests and manual runs use the full SDK matrix and lint every variant. The job summary
# names the mode. Documentation-only pushes (docs/**, *.md) run no CI.
#
# Screenshot goldens (Roborazzi) are recorded here, because Robolectric cannot run in the development container.
# Dispatch this workflow on your branch with `record_screenshots: true` (GitHub MCP tool `actions_run_trigger`:
# owner resace3, repo agentle-android, workflow_id ci.yml, ref <your branch>, inputs {"record_screenshots": true}).
# Only the `record-screenshots` job runs: `./gradlew recordRoborazziDebug`, then it commits the changed files under
# `**/src/screenshots/**` to that branch as github-actions[bot] ("test: record screenshot goldens [skip ci]"). It
# refuses to run on main. Pull before you push again. Normal runs verify goldens (`verifyRoborazziDebug`) in every
# module that has some; a module without goldens is not verified. Pin screenshot tests to one SDK
# (`@Config(sdk = [37])`) so the light and the full Robolectric matrix verify the same image.
name: CI

on:
  push:
    branches: [main, 'android/**']
    paths-ignore: ['docs/**', '**/*.md']
  pull_request:
  workflow_dispatch:
    inputs:
      emulator:
        description: Run instrumented tests on the emulator matrix
        type: boolean
        default: false
      api_levels:
        description: JSON list of emulator API levels
        type: string
        default: "[29, 31, 34, 36]"
      record_screenshots:
        description: Record Roborazzi screenshot goldens and commit them to this branch (never main)
        type: boolean
        default: false

concurrency:
  # Per event, so a manual run (recording goldens, emulator tests) and a push run on the same branch do not cancel
  # each other. A newer push still cancels an older push run.
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  jvm:
    name: JVM modules
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.record_screenshots) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AGENTLE_JVM_ONLY: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6.4.0
        with:
          add-job-summary: never
      - name: Record start
        run: echo "START=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
      - name: Test, detekt, ktlint
        shell: bash
        # An evidence run: --no-build-cache, so no test result is restored from a cache (Test counts checks with
        # --fresh-after). detektMain/detektTest are the type-resolved detekt tasks: plain `detekt` skips
        # ForbiddenMethodCall. writeExpectedSuites lists the suites that must have run (build/expected-suites.txt).
        # verifyCoverageGates writes each module's Kover XML and runs koverVerify; writeCoverageGates lists the gates.
        run: >-
          mkdir -p build && ./gradlew --no-build-cache
          test detekt detektMain detektTest spotlessCheck verifyNoSecrets writeExpectedSuites
          verifyCoverageGates writeCoverageGates --continue
          2>&1 | tee build/gradle-output.log
      - name: Test counts and coverage
        if: always()
        run: >-
          mkdir -p build && python3 tools/junit_summary.py --root . --expect-file build/expected-suites.txt
          --coverage-gates build/coverage-gates.txt
          --fresh-after "$START" --json build/junit-summary.json --markdown "$GITHUB_STEP_SUMMARY"
      - name: Failure digest
        if: failure()
        run: python3 tools/ci_digest.py build/gradle-output.log
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jvm-reports
          path: |
            build/junit-summary.json
            **/build/reports/
            **/build/test-results/
          retention-days: 14

  android:
    name: Android build, unit tests, lint
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.record_screenshots) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6.4.0
        with:
          add-job-summary: never
      - name: CI mode
        id: mode
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          GIT_REF: ${{ github.ref }}
        run: |
          # Branch-light on pushes to android/** (compile checks of the Android teams): lowest and newest Robolectric
          # SDK, one lint variant. Everything else (main, pull requests, manual runs) runs the full matrix, which is
          # the KotlinAndroid.kt convention's default list.
          if [ "$EVENT_NAME" = "push" ] && [[ "$GIT_REF" == refs/heads/android/* ]]; then
            mode=branch-light; sdks=29,37; lint="lintDebug"
          else
            mode=full; sdks=29,30,31,33,34,35,36,37; lint="lintDebug lintFakeDebug lintProdDebug"
          fi
          { echo "mode=$mode"; echo "sdks=$sdks"; echo "lint=$lint"; } >> "$GITHUB_OUTPUT"
          { echo "## Android CI mode: $mode"; echo; echo "- Robolectric SDKs: $sdks"; echo "- Lint tasks: $lint";
            echo "- Event: $EVENT_NAME, ref: $GIT_REF"; } >> "$GITHUB_STEP_SUMMARY"
          echo "Android CI mode: $mode (Robolectric SDKs $sdks; lint: $lint)"
      - name: Accept SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Record start
        run: echo "START=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
      - name: SDK inventory (API 36+ platforms and system images)
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --list 2>/dev/null \
            | grep -E "platforms;android-3[6-9]|system-images;android-3[6-9][^|]*(google_apis|default)[^|]*x86_64" \
            | sort -u | head -40
      - name: Screenshot verification (modules with goldens)
        id: screenshots
        shell: bash
        run: |
          # verifyRoborazziDebug fails on a missing golden, so only modules with goldens in src/screenshots are
          # verified; the others run their screenshot tests without comparing.
          tasks=$(find . -path ./.git -prune -o -path '*/build' -prune -o -path '*/src/screenshots/*' -name '*.png' -print \
            | sed -E 's#^\./##; s#/src/screenshots/.*##' | sort -u \
            | sed -E 's#/#:#g; s#^#:#; s#$#:verifyRoborazziDebug#' | tr '\n' ' ')
          echo "tasks=$tasks" >> "$GITHUB_OUTPUT"
          echo "- Screenshot verification: ${tasks:-none (no module has goldens)}" >> "$GITHUB_STEP_SUMMARY"
          echo "Screenshot verification: ${tasks:-none}"
      - name: Build, unit tests, lint, fake isolation
        shell: bash
        # An evidence run (--no-build-cache, see the JVM job). The JVM modules' tests run in the JVM job, so the
        # expected suites and the coverage reports here are the Android modules' only.
        run: >-
          mkdir -p build && ./gradlew --no-build-cache
          assembleFakeDebug assembleProdDebug assembleProdRelease
          testDebugUnitTest testFakeDebugUnitTest testProdDebugUnitTest
          ${{ steps.screenshots.outputs.tasks }}
          ${{ steps.mode.outputs.lint }}
          detekt detektMain detektTest spotlessCheck verifyNoFakesInProd
          writeExpectedSuites -Pagentle.expectedSuites=android
          verifyCoverageGates writeCoverageGates -Pagentle.coverage.modules=android
          -ProbolectricSdks=${{ steps.mode.outputs.sdks }}
          --continue 2>&1 | tee build/gradle-output.log
      - name: Test counts and coverage
        if: always()
        run: >-
          mkdir -p build && python3 tools/junit_summary.py --root . --expect-file build/expected-suites.txt
          --coverage-gates build/coverage-gates.txt
          --fresh-after "$START" --json build/junit-summary.json --markdown "$GITHUB_STEP_SUMMARY"
      - name: Failure digest
        if: failure()
        run: python3 tools/ci_digest.py build/gradle-output.log
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-reports
          path: |
            build/junit-summary.json
            **/build/reports/
            **/build/test-results/
          retention-days: 14
      - name: Upload APKs
        uses: actions/upload-artifact@v7
        with:
          name: apks
          path: app/build/outputs/apk/
          retention-days: 7

  record-screenshots:
    name: Record screenshot goldens
    if: github.event_name == 'workflow_dispatch' && inputs.record_screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Refuse main and non-branch refs
        env:
          GIT_REF: ${{ github.ref }}
        run: |
          if [ "$GIT_REF" = "refs/heads/main" ]; then
            echo "::error::Goldens are never recorded on main. Dispatch record_screenshots on your own branch."
            exit 1
          fi
          case "$GIT_REF" in
            refs/heads/*) echo "Recording goldens for $GIT_REF" ;;
            *) echo "::error::record_screenshots needs a branch ref, got $GIT_REF"; exit 1 ;;
          esac
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6.4.0
        with:
          add-job-summary: never
      - name: Accept SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Record goldens
        shell: bash
        run: mkdir -p build && ./gradlew recordRoborazziDebug --continue 2>&1 | tee build/gradle-output.log
      - name: Commit changed goldens
        shell: bash
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- ':(glob)**/src/screenshots/**'
          if git diff --cached --quiet; then
            echo "No golden changed." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git diff --cached --stat | tee -a "$GITHUB_STEP_SUMMARY"
          git commit -m "test: record screenshot goldens [skip ci]"
          if ! git push origin "HEAD:refs/heads/$BRANCH"; then
            echo "::error::Could not push the goldens: $BRANCH moved while recording. Dispatch record_screenshots again."
            exit 1
          fi
      - name: Failure digest
        if: failure()
        run: python3 tools/ci_digest.py build/gradle-output.log
      - name: Upload Roborazzi reports and goldens
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screenshot-goldens
          path: |
            **/build/reports/roborazzi/
            **/src/screenshots/
          retention-days: 14

  emulator:
    name: Emulator API ${{ matrix.api-level }}
    if: github.event_name == 'workflow_dispatch' && inputs.emulator
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        api-level: ${{ fromJSON(inputs.api_levels) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6.4.0
        with:
          add-job-summary: never
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build test APKs
        shell: bash
        run: mkdir -p build && ./gradlew assembleFakeDebug assembleFakeDebugAndroidTest 2>&1 | tee build/gradle-output.log
      - name: Instrumented tests
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: ./gradlew connectedFakeDebugAndroidTest --continue
      - name: Test counts
        if: always()
        run: mkdir -p build && python3 tools/junit_summary.py --root . --json build/junit-summary.json --markdown "$GITHUB_STEP_SUMMARY"
      - name: Failure digest
        if: failure()
        run: python3 tools/ci_digest.py build/gradle-output.log
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: emulator-${{ matrix.api-level }}-reports
          path: |
            build/junit-summary.json
            **/build/reports/
            **/build/outputs/androidTest-results/
          retention-days: 14
